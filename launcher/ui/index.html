<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legacy Player — Home</title>
<meta name="theme-color" content="#050816">
<style>
:root{--bg:#050816;--panel:rgba(22,30,64,.58);--panel2:rgba(255,255,255,.07);--line:rgba(255,255,255,.13);--text:#eef1ff;--mute:#b9c5ea;--link:#8fb2ff;--grad-btn:linear-gradient(135deg,#2f62e0,#6a48f0 55%,#07805e);--accent:#4f8cff;--accent2:#3be0a8;--warn:#ffb454;--bad:#ff8c98;--r:16px;--grad:linear-gradient(135deg,#4f8cff,#7a5cff 55%,#3be0a8);--glow:0 0 22px rgba(79,140,255,.45);--chrome:rgba(8,12,30,.72)}
[data-theme=light]{--orb1:#4f8cff;--orb2:#3be0a8;--bg:#eef2fb;--panel:rgba(255,255,255,.78);--panel2:rgba(30,50,120,.07);--line:rgba(30,50,120,.16);--text:#141a36;--mute:#2b3566;--accent:#2f62e0;--link:#2f62e0;--accent2:#066f53;--warn:#a85a00;--bad:#c92a3b;--glow:0 0 18px rgba(47,98,224,.28);--chrome:rgba(255,255,255,.82)}
*{box-sizing:border-box}
html{scrollbar-color:#3a4a8a transparent}
body{margin:0;color:var(--text);font:15px/1.5 "Segoe UI Variable","Segoe UI",system-ui,Roboto,sans-serif;background:var(--bg);min-height:100vh}
button,input,select{font:inherit;color:inherit}
option{background:#141a33;color:#eef1ff}
[data-mode=light] option{background:#fff;color:#141a36}
/* colour themes: each changes the background, panels and accents; "dark" and "light" are above */
[data-theme=ocean]{--wave-mid:#0e7490;--bg:#031a24;--panel:rgba(8,40,56,.58);--accent:#38bdf8;--accent2:#34d399;--link:#7dd3fc;--grad-btn:linear-gradient(135deg,#0369a1,#0e7490 55%,#047857);--grad:linear-gradient(135deg,#38bdf8,#34d399);--glow:0 0 22px rgba(56,189,248,.42);--chrome:rgba(3,22,32,.74);--solid:#06222e}
[data-theme=ocean] .bg{background:radial-gradient(1100px 700px at 12% -8%,#0b4f6c 0%,transparent 60%),radial-gradient(900px 620px at 98% 8%,#0d6a5a 0%,transparent 55%),linear-gradient(180deg,#05243a,#031a24)}
[data-theme=forest]{--wave-mid:#3f8a2a;--bg:#04150c;--panel:rgba(10,38,22,.58);--accent:#4ade80;--accent2:#bef264;--link:#86efac;--grad-btn:linear-gradient(135deg,#15803d,#3f6212 55%,#0f766e);--grad:linear-gradient(135deg,#4ade80,#bef264);--glow:0 0 22px rgba(74,222,128,.42);--chrome:rgba(4,24,12,.74);--solid:#08210f}
[data-theme=forest] .bg{background:radial-gradient(1100px 700px at 12% -8%,#14532d 0%,transparent 60%),radial-gradient(900px 620px at 98% 8%,#3f6212 0%,transparent 55%),linear-gradient(180deg,#06200f,#04150c)}
[data-theme=sunset]{--wave-mid:#be185d;--bg:#1a0a10;--panel:rgba(50,20,24,.58);--accent:#fb923c;--accent2:#f472b6;--link:#fdba74;--grad-btn:linear-gradient(135deg,#c2410c,#be185d 55%,#9d174d);--grad:linear-gradient(135deg,#fb923c,#f472b6);--glow:0 0 22px rgba(251,146,60,.42);--chrome:rgba(30,12,16,.74);--solid:#2a1015}
[data-theme=sunset] .bg{background:radial-gradient(1100px 700px at 12% -8%,#7c2d12 0%,transparent 60%),radial-gradient(900px 620px at 98% 8%,#9d174d 0%,transparent 55%),linear-gradient(180deg,#2a0f14,#1a0a10)}
[data-theme=rose]{--wave-mid:#9333ea;--bg:#1c0b16;--panel:rgba(56,18,44,.58);--accent:#f472b6;--accent2:#c084fc;--link:#f9a8d4;--grad-btn:linear-gradient(135deg,#be185d,#7e22ce 55%,#6b21a8);--grad:linear-gradient(135deg,#f472b6,#c084fc);--glow:0 0 22px rgba(244,114,182,.42);--chrome:rgba(34,12,28,.74);--solid:#2a0f22}
[data-theme=rose] .bg{background:radial-gradient(1100px 700px at 12% -8%,#831843 0%,transparent 60%),radial-gradient(900px 620px at 98% 8%,#6b21a8 0%,transparent 55%),linear-gradient(180deg,#2b0f22,#1c0b16)}
[data-theme=violet]{--wave-mid:#4f46e5;--bg:#0d0820;--panel:rgba(32,20,70,.58);--accent:#a78bfa;--accent2:#60a5fa;--link:#c4b5fd;--grad-btn:linear-gradient(135deg,#6d28d9,#4338ca 55%,#1d4ed8);--grad:linear-gradient(135deg,#a78bfa,#60a5fa);--glow:0 0 22px rgba(167,139,250,.42);--chrome:rgba(16,10,40,.74);--solid:#170f33}
[data-theme=violet] .bg{background:radial-gradient(1100px 700px at 12% -8%,#4c1d95 0%,transparent 60%),radial-gradient(900px 620px at 98% 8%,#1e3a8a 0%,transparent 55%),linear-gradient(180deg,#160d33,#0d0820)}
[data-theme=crimson]{--wave-mid:#c2410c;--bg:#170507;--panel:rgba(48,14,16,.58);--accent:#f87171;--accent2:#fbbf24;--link:#fca5a5;--grad-btn:linear-gradient(135deg,#b91c1c,#9a3412 55%,#92400e);--grad:linear-gradient(135deg,#f87171,#fbbf24);--glow:0 0 22px rgba(248,113,113,.42);--chrome:rgba(30,8,10,.74);--solid:#240a0c}
[data-theme=crimson] .bg{background:radial-gradient(1100px 700px at 12% -8%,#7f1d1d 0%,transparent 60%),radial-gradient(900px 620px at 98% 8%,#451a03 0%,transparent 55%),linear-gradient(180deg,#240a0c,#170507)}
[data-theme=graphite]{--wave-mid:#64748b;--bg:#0c0d10;--panel:rgba(30,32,38,.58);--accent:#93c5fd;--accent2:#86efac;--link:#bfdbfe;--grad-btn:linear-gradient(135deg,#3f3f46,#52525b 55%,#475569);--grad:linear-gradient(135deg,#93c5fd,#86efac);--glow:0 0 22px rgba(147,197,253,.42);--chrome:rgba(14,15,18,.74);--solid:#17181c}
[data-theme=graphite] .bg{background:radial-gradient(1100px 700px at 12% -8%,#2a2f3a 0%,transparent 60%),radial-gradient(900px 620px at 98% 8%,#1f2937 0%,transparent 55%),linear-gradient(180deg,#14161b,#0c0d10)}
/* living background: drifting waves and soft light, like a console dashboard */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1100px 700px at 12% -8%,#1c2f80 0%,transparent 60%),radial-gradient(900px 620px at 98% 8%,#0d6a6a 0%,transparent 55%),linear-gradient(180deg,#090e2c,#050816)}
[data-theme=light] .bg{background:radial-gradient(1100px 700px at 12% -8%,#c9d8ff 0%,transparent 60%),radial-gradient(900px 620px at 98% 8%,#c6f5e6 0%,transparent 55%),linear-gradient(180deg,#f3f6ff,#e6ecf9)}
/* background styles (Preferences > Look): the same theme colours, a different picture behind the app */
[data-bg=aurora] .bg svg{display:none}
[data-bg=aurora] .orb{opacity:.5;filter:blur(90px)}
[data-bg=aurora] .o1{width:60vw;height:50vh;left:-10%;top:-8%;animation-duration:30s}
[data-bg=aurora] .o2{width:55vw;height:46vh;right:-10%;top:30%;animation-duration:38s}
[data-bg=aurora] .bg::after{content:"";position:absolute;inset:-20%;background:conic-gradient(from 0deg at 50% 60%,transparent 0 55%,color-mix(in srgb,var(--accent) 38%,transparent) 65%,transparent 78%,color-mix(in srgb,var(--accent2) 30%,transparent) 88%,transparent);filter:blur(70px);animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
[data-bg=grid] .bg svg,[data-bg=grid] .orb{display:none}
[data-bg=grid] .bg::before{content:"";position:absolute;left:-50%;right:-50%;bottom:-10%;height:80%;background:linear-gradient(color-mix(in srgb,var(--accent) 70%,transparent) 1px,transparent 1px) 0 0/100% 46px,linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,transparent) 1px,transparent 1px) 0 0/64px 100%;transform:perspective(420px) rotateX(62deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%);animation:gridgo 3.5s linear infinite}
@keyframes gridgo{to{background-position:0 46px,0 0}}
[data-bg=stars] .bg svg,[data-bg=stars] .orb{display:none}
[data-bg=stars] .bg::before,[data-bg=stars] .bg::after{content:"";position:absolute;inset:0;background-repeat:repeat}
[data-bg=stars] .bg::before{background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#fff9,transparent),radial-gradient(1.5px 1.5px at 160px 60px,#fff,transparent),radial-gradient(1px 1px at 230px 190px,#fff8,transparent),radial-gradient(2px 2px at 300px 90px,#fff,transparent);background-size:340px 240px;animation:twinkle 5s ease-in-out infinite alternate}
[data-bg=stars] .bg::after{background-image:radial-gradient(1px 1px at 60px 80px,#fff9,transparent),radial-gradient(1.5px 1.5px at 190px 150px,#fff,transparent),radial-gradient(1px 1px at 270px 20px,#fff8,transparent);background-size:290px 210px;animation:twinkle 7s ease-in-out -2s infinite alternate}
@keyframes twinkle{from{opacity:.35}to{opacity:1}}
[data-mode=light][data-bg=stars] .bg::before,[data-mode=light][data-bg=stars] .bg::after{filter:invert(1) opacity(.5)}
[data-bg=dots] .bg svg{display:none}
[data-bg=dots] .bg::before{content:"";position:absolute;inset:0;background:radial-gradient(color-mix(in srgb,var(--text) 22%,transparent) 1.4px,transparent 1.6px) 0 0/26px 26px;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000,transparent 80%);mask-image:radial-gradient(ellipse at 50% 40%,#000,transparent 80%)}
[data-bg=crt] .bg svg,[data-bg=crt] .orb{display:none}
[data-bg=crt] .bg::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);animation:crtroll 9s linear infinite}
[data-bg=crt] .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%),linear-gradient(transparent 46%,color-mix(in srgb,var(--accent) 9%,transparent) 50%,transparent 54%);background-size:100% 100%,100% 240%;animation:crtbar 7s linear infinite,crtflick .12s steps(2) infinite}
@keyframes crtroll{to{background-position:0 6px}}@keyframes crtbar{from{background-position:0 0,0 -120%}to{background-position:0 0,0 120%}}@keyframes crtflick{50%{opacity:.94}}
[data-mode=light][data-bg=crt] .bg::before{background:repeating-linear-gradient(0deg,rgba(30,50,120,.1) 0 1px,transparent 1px 3px)}
[data-bg=bokeh] .bg svg{display:none}
[data-bg=bokeh] .orb{display:none}
[data-bg=bokeh] .bg::before,[data-bg=bokeh] .bg::after{content:"";position:absolute;inset:-10%;background-repeat:no-repeat}
[data-bg=bokeh] .bg::before{background-image:radial-gradient(circle,color-mix(in srgb,var(--accent) 38%,transparent) 0 40%,transparent 41%),radial-gradient(circle,color-mix(in srgb,var(--accent2) 34%,transparent) 0 40%,transparent 41%),radial-gradient(circle,color-mix(in srgb,var(--accent) 26%,transparent) 0 40%,transparent 41%),radial-gradient(circle,color-mix(in srgb,var(--accent2) 22%,transparent) 0 40%,transparent 41%);background-size:140px 140px,220px 220px,90px 90px,300px 300px;background-position:8% 20%,80% 12%,60% 70%,24% 86%;filter:blur(7px);animation:bokehA 28s ease-in-out infinite alternate}
[data-bg=bokeh] .bg::after{background-image:radial-gradient(circle,color-mix(in srgb,var(--accent2) 30%,transparent) 0 40%,transparent 41%),radial-gradient(circle,color-mix(in srgb,var(--accent) 30%,transparent) 0 40%,transparent 41%),radial-gradient(circle,color-mix(in srgb,var(--accent2) 24%,transparent) 0 40%,transparent 41%);background-size:170px 170px,110px 110px,260px 260px;background-position:40% 8%,92% 62%,6% 52%;filter:blur(12px);animation:bokehB 36s ease-in-out infinite alternate}
@keyframes bokehA{from{transform:translate(0,0)}to{transform:translate(-3%,4%)}}@keyframes bokehB{from{transform:translate(0,0)}to{transform:translate(4%,-3%)}}
#bitworld{display:none}
[data-bg=bitworld] .bg svg,[data-bg=bitworld] .orb,[data-bg=bitcity] .bg svg,[data-bg=bitcity] .orb,[data-bg=bitforest] .bg svg,[data-bg=bitforest] .orb{display:none}
[data-bg=bitworld] #bitworld,[data-bg=bitcity] #bitworld,[data-bg=bitforest] #bitworld{display:block;position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:.8}
[data-bg=scene] .bg svg,[data-bg=scene] .orb{display:none}
[data-bg=scene] #bitworld{display:block;position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:1}
[data-bg=scene] .bg::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 34%,transparent),color-mix(in srgb,var(--bg) 60%,transparent) 55%,color-mix(in srgb,var(--bg) 72%,transparent))}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.wtile{display:flex;flex-direction:column;gap:4px;text-align:left;padding:6px 6px 8px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font:inherit;transition:transform .12s,border-color .15s}
.wtile:hover{border-color:var(--accent);transform:translateY(-2px)}.wtile.on{outline:3px solid var(--accent);outline-offset:1px;border-color:transparent}.wtile:focus-visible{outline:3px solid var(--text);outline-offset:1px}
.wtile .wthumb{width:100%;aspect-ratio:120/54;height:auto;border-radius:8px;image-rendering:pixelated;display:block;border:1px solid var(--line)}
.wtile b{font-size:.9rem;padding:0 2px}.wtile span{font-size:.74rem;color:var(--mute);padding:0 2px;line-height:1.3}
.themes .wsw{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);padding:0;cursor:pointer;image-rendering:pixelated}
.themes .wsw.on{outline:3px solid var(--accent);outline-offset:2px}.themes .wsw:focus-visible{outline:3px solid var(--text);outline-offset:2px}
/* holidays: the one-time question and the note in the theme pickers */
.holidayask{position:fixed;left:16px;bottom:16px;z-index:60;display:flex;gap:12px;align-items:center;max-width:min(460px,calc(100vw - 32px));padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--solid);color:var(--text);box-shadow:0 14px 34px rgba(0,0,0,.35);animation:holidayIn .35s ease-out;transition:opacity .25s,transform .25s}
.holidayask.gone{opacity:0;transform:translateY(12px)}.holidayask p{margin:0 0 8px;font-weight:600}.holidayask .wthumb{width:96px;height:auto;border-radius:8px;image-rendering:pixelated;flex:none;border:1px solid var(--line)}
@keyframes holidayIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media(max-width:520px){.holidayask{left:8px;right:8px;bottom:8px;max-width:none}.holidayask .wthumb{width:64px}}
.holidaynote{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 0;padding:8px 10px;border-radius:10px;border:1px dashed var(--line);background:var(--panel2);color:var(--text)}
/* pixelTitle(): text in a little bitmap font drawn as SVG squares, so it stays crisp at any size and screen */
.pxtitle{--px:5px;display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:calc(var(--px)*3);row-gap:calc(var(--px)*1.5);margin:0 0 8px;line-height:1}
.pxtitle svg{display:block;width:calc(var(--px)*var(--w));max-width:100%;height:auto;shape-rendering:crispEdges;overflow:visible}
.pxtitle.cycle svg{animation:pxcycle 9s linear infinite}
@keyframes pxcycle{to{filter:hue-rotate(360deg)}}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media(max-width:700px){.pxtitle{--px:4px}}@media(max-width:400px){.pxtitle{--px:3px}}
.worldfold>summary{padding:6px 0;flex-wrap:wrap}.worldfold>summary .small{margin-left:auto}
.tlabel{font:800 .68rem ui-monospace,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:10px 0 6px}
[data-bg=plain] .bg svg,[data-bg=plain] .orb{display:none}
[data-bg=plain] .bg{background:var(--bg)!important}
@media(prefers-reduced-motion:reduce){.bg *,.bg::before,.bg::after{animation:none!important}}
.bgpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.bgpick button{display:flex;flex-direction:column;gap:6px;align-items:stretch;padding:6px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);cursor:pointer;text-align:center;font-size:.8rem}
.bgpick button .tile{height:54px;border-radius:8px;border:1px solid var(--line);background-color:var(--bg)}
.bgpick button.on{outline:3px solid var(--accent);outline-offset:1px}.bgpick button:focus-visible{outline:3px solid var(--text);outline-offset:1px}
.themes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.themes .sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.themes .sw.on{outline:3px solid var(--accent);outline-offset:2px}.themes .sw:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.bg svg{position:absolute;left:-10%;width:140%;bottom:0;height:40vh;opacity:.3}
.bg svg path{fill:url(#wg)}
#wg stop:nth-child(1){stop-color:var(--orb1,var(--accent))}#wg stop:nth-child(2){stop-color:var(--wave-mid,#7a5cff)}#wg stop:nth-child(3){stop-color:var(--orb2,var(--accent2))}
.bg .w1{animation:drift 26s ease-in-out infinite alternate}.bg .w2{bottom:-4vh;opacity:.22;animation:drift 38s ease-in-out infinite alternate-reverse}.bg .w3{bottom:-9vh;opacity:.16;animation:drift 52s ease-in-out infinite alternate}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:float 18s ease-in-out infinite alternate}
.o1{width:380px;height:380px;background:var(--orb1,var(--accent));left:8%;top:18%}.o2{width:320px;height:320px;background:var(--orb2,var(--accent2));right:6%;top:42%;animation-duration:24s}
@keyframes drift{from{transform:translateX(-4%)}to{transform:translateX(6%)}}
@keyframes float{from{transform:translate(0,0)}to{transform:translate(40px,-30px)}}
/* window chrome: menu bar then brand and tabs */
.chrome{position:sticky;top:0;z-index:30;background:var(--chrome);backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--line)}
#menubar{display:flex;align-items:center;gap:2px;padding:3px 10px;border-bottom:1px solid var(--line);font-size:.88rem}
.menu{position:relative}
.menu>button{background:none;border:0;padding:4px 12px;border-radius:6px;cursor:pointer;color:var(--text)}
.menu>button:hover,.menu.open>button{background:var(--panel2)}
.dd{position:absolute;top:100%;left:0;min-width:230px;padding:6px;border-radius:12px;background:var(--chrome);backdrop-filter:blur(22px);border:1px solid var(--line);box-shadow:0 18px 40px #0008;display:none;animation:pop .14s ease both}
.menu.open .dd{display:block}
.menu.right .dd{left:auto;right:0;min-width:300px}
.code.small{font:600 .78rem/1.3 ui-monospace,Consolas,monospace;letter-spacing:.02em;padding:3px 8px;border-radius:8px;word-break:break-all;display:inline-block}
.dd .code.small{font-size:.72rem}
.dd button{display:flex;width:100%;gap:10px;align-items:center;background:none;border:0;text-align:left;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--text)}
.dd button:hover,.dd button:focus-visible{background:var(--accent);color:#fff;outline:none}
.dd hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.who{display:flex;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:999px;padding:2px 12px 2px 3px;cursor:pointer}
.who:hover{background:var(--panel2);border-color:var(--line)}.who .nm{font-size:.86rem}
header{display:flex;align-items:center;gap:18px;padding:8px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.wordmark{font-weight:800;letter-spacing:.4px;font-size:1.15rem}.wordmark b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{position:relative;background:none;border:0;padding:9px 16px;border-radius:10px;cursor:pointer;color:var(--mute);font-weight:600;transition:color .2s,background .2s}
nav button:hover{color:var(--text);background:var(--panel2)}
nav button.on{color:var(--text)}
nav button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:3px;border-radius:3px;background:var(--grad);box-shadow:var(--glow)}
#busybar{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;opacity:0;transition:opacity .2s;background:linear-gradient(90deg,transparent,#4f8cff,#3be0a8,transparent);background-size:40% 100%;background-repeat:no-repeat;animation:slide 1.1s linear infinite}
body.busy #busybar{opacity:1}
@keyframes slide{from{background-position:-40% 0}to{background-position:140% 0}}
main{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
main>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}main>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3){animation-delay:.08s}main>*:nth-child(4){animation-delay:.12s}main>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
h2{margin:.2em 0 .6em;font-size:1.5rem;letter-spacing:.2px}h3{margin:1em 0 .4em;font-size:1.05rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.card,.panel{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.025)),var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.1)}
[data-mode=light] .card,[data-mode=light] .panel{box-shadow:0 8px 24px rgba(40,60,130,.12),inset 0 1px 0 #fff}
.btn{background:var(--panel2);border:1px solid var(--line);padding:8px 15px;border-radius:11px;cursor:pointer;transition:transform .12s,border-color .2s,box-shadow .2s}
.btn:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.18)}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad-btn);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 6px 18px rgba(79,140,255,.35)}
.btn.good{background:linear-gradient(135deg,#34d399,#3be0a8);border-color:transparent;color:#04251c;font-weight:600}.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:99;animation:rise .2s both}
.modalbox{background:var(--chrome);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:460px;width:90%;box-shadow:0 30px 70px #000a}
input[type=text],input[type=number],input[type=search],select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.22)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:.9rem;transition:all .15s}
.chip:hover{border-color:var(--accent)}.chip.on{background:var(--grad-btn);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(79,140,255,.35)}.chip small{opacity:.92;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:12px}
.game{position:relative;padding:14px;border-radius:var(--r);background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02)),var(--panel);border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:128px;transition:transform .18s,border-color .2s,box-shadow .2s;overflow:hidden}
.game::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad);opacity:.7}
.game:hover,.game:focus-visible{border-color:var(--accent);outline:none;transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.4),var(--glow)}
.game .t{font-weight:650;line-height:1.25;padding-right:28px}.game .m{color:var(--mute);font-size:.82rem}
.star{z-index:4;position:absolute;top:8px;right:8px;background:#000000b3;border:0;border-radius:50%;width:32px;height:32px;line-height:32px;padding:0;text-align:center;font-size:1.15rem;cursor:pointer;color:#fff;transition:transform .15s}.star:hover{transform:scale(1.25) rotate(12deg)}.star.on{color:#ffcf40;text-shadow:0 0 10px #ffcf4088}
.badge{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.badge.strong,.badge.good{color:var(--accent2);border-color:var(--accent2)}.badge.per-game{color:var(--accent);border-color:var(--accent)}
.badge.experimental,.badge.not-practical{color:var(--warn);border-color:var(--warn)}
.list .game{flex-direction:row;align-items:center;min-height:0;padding:10px 14px}
.muted{color:var(--mute)}.small{font-size:.85rem}.bad{color:var(--bad)}.good{color:var(--accent2)}.warn{color:var(--warn)}
.why{background:var(--panel2);border-left:3px solid var(--accent);padding:9px 14px;border-radius:10px;margin:8px 0 14px;color:var(--mute);font-size:.9rem}
.i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--mute);color:var(--mute);font-size:.7rem;cursor:pointer;margin-left:6px;background:none}
table{border-collapse:collapse;width:100%}td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{color:var(--mute);font-weight:600;font-size:.82rem}
tr.avg td{border-top:2px solid var(--line)}
.code{font:700 2rem/1 ui-monospace,Consolas,monospace;letter-spacing:.12em;background:var(--panel2);padding:12px 18px;border-radius:12px;border:1px dashed var(--accent);display:inline-block}
.drawer{position:fixed;inset:0 0 0 auto;width:min(480px,100%);background:var(--chrome);backdrop-filter:blur(22px);border-left:1px solid var(--line);padding:20px;overflow:auto;z-index:48;box-shadow:-10px 0 40px #0008;animation:slidein .25s ease both}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.scrim{position:fixed;inset:0;background:#0007;z-index:47}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:70;max-width:380px}
.toast{background:var(--chrome);backdrop-filter:blur(18px);border:1px solid var(--line);border-left:4px solid var(--accent);padding:10px 14px;border-radius:12px;box-shadow:0 10px 28px #0007;animation:toastin .3s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes toastin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.toast{overflow-wrap:anywhere;max-width:min(440px,calc(100vw - 32px))}.toast.warn{border-left-color:var(--warn)}.toast.err{border-left-color:var(--bad)}
.feed{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:6px}.feed div{padding:6px 10px;background:var(--panel2);border-radius:8px}.feed .warn{border-left:3px solid var(--warn)}
.pad{display:flex;gap:6px;flex-wrap:wrap}.pad span{padding:4px 10px;border-radius:8px;border:1px solid var(--line)}.pad span.hit{background:var(--accent2);color:#04251c;border-color:var(--accent2)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--bad)}.dot.on{background:var(--accent2);animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(59,224,168,.7)}100%{box-shadow:0 0 0 10px rgba(59,224,168,0)}}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
details.fold>summary{display:flex;align-items:center;gap:10px;padding:2px 0}details.fold>summary::before{content:"▸";color:var(--mute);transition:transform .2s}details.fold[open]>summary::before{transform:rotate(90deg)}
@media(max-width:600px){main{padding:12px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.tv{padding:8px}.tvbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tvcard{padding:22px 14px;border-radius:16px;border:2px solid var(--line);background:var(--panel);backdrop-filter:blur(10px);min-height:90px;cursor:pointer;transition:transform .15s,border-color .15s}.tvcard.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.35),var(--glow);transform:scale(1.04)}.tvtitle{font-size:16px;font-weight:600}.tvhelp{margin-top:14px}
/* pixel art and Martin */
.px{image-rendering:pixelated;display:block}
.px .peye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.martin{animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 4px 10px rgba(79,140,255,.45))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes hop{0%,100%{transform:translateY(0) scaleY(1)}40%{transform:translateY(-9px) scaleY(1.06)}70%{transform:translateY(0) scaleY(.92)}}
body.busy .brand .martin,.hop{animation:hop .55s ease-in-out infinite}
.cheer{animation:hop .8s ease-in-out 3}
.avatar{border-radius:10px;background:linear-gradient(145deg,#26336e,#141a3c);padding:3px;border:1px solid var(--line)}
.avatars{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.avatars button{background:none;border:2px solid transparent;border-radius:14px;padding:3px;cursor:pointer;transition:transform .15s,border-color .15s}
.avatars button:hover{transform:translateY(-3px) scale(1.05)}.avatars button.on{border-color:var(--accent2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent2) 35%,transparent);background:color-mix(in srgb,var(--accent2) 14%,transparent)}
.avatars button{position:relative}.avatars button.on::after{content:"✓";position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 system-ui,sans-serif;background:var(--accent2);color:var(--bg);box-shadow:0 0 0 2px var(--bg)}
.avatars button:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.avprev{display:flex;gap:14px;align-items:center}.avprev .avatar{transition:transform .2s}.avprev.bump .avatar{animation:avbump .3s ease-out}
@keyframes avbump{50%{transform:scale(1.12)}}
/* hero, flashy cards, shelves */
.hero{display:flex;gap:26px;align-items:center;padding:26px 28px;border-radius:22px;border:1px solid var(--line);position:relative;overflow:hidden;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 28%,transparent),color-mix(in srgb,var(--accent) 12%,transparent) 50%,color-mix(in srgb,var(--accent2) 22%,transparent)),var(--panel);box-shadow:0 16px 40px rgba(0,0,0,.35)}
.hero::after{content:"";position:absolute;inset:-40% -10% auto auto;width:420px;height:420px;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%);animation:float 14s ease-in-out infinite alternate;pointer-events:none}
.hero h1{margin:0 0 4px;font-size:2rem;letter-spacing:.3px}.hero p{margin:4px 0;color:var(--mute);max-width:620px}
.flashes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:18px 0}
.flash{position:relative;border-radius:18px;padding:18px 18px 20px;border:1px solid var(--line);overflow:hidden;background:linear-gradient(145deg,rgba(0,0,0,.4),rgba(0,0,0,.4)),linear-gradient(145deg,var(--c1),var(--c2));color:#fff;transition:transform .2s,box-shadow .2s;min-height:150px}
.flash:hover{transform:translateY(-5px) rotate(-.4deg);box-shadow:0 18px 36px rgba(0,0,0,.45)}
.flash::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-18deg);animation:shine 5.5s ease-in-out infinite}
.flash:nth-child(2)::after{animation-delay:1.2s}.flash:nth-child(3)::after{animation-delay:2.4s}.flash:nth-child(4)::after{animation-delay:3.6s}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.flash h3{margin:.6em 0 .3em;font-size:1.08rem;color:#fff}.flash p{margin:0;font-size:.88rem;color:rgba(255,255,255,.95)}
.shelf{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px}.shelf .game{min-width:220px;max-width:240px;flex:0 0 auto}
.featured{border:1px dashed var(--accent);background:linear-gradient(120deg,rgba(255,180,84,.14),rgba(255,107,122,.1)),var(--panel)}
.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:2px 9px;border-radius:999px;background:var(--warn);color:#2a1800}
.pstat{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.bar{height:10px;border-radius:6px;background:var(--panel2);overflow:hidden}.bar>i{display:block;height:100%;border-radius:6px;background:var(--grad)}
.bar.live>i{width:40%;animation:slide2 1.2s ease-in-out infinite alternate}
@keyframes slide2{from{margin-left:0}to{margin-left:60%}}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent2);animation:rot .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes rot{to{transform:rotate(360deg)}}
.dots::after{content:"";animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.ip{display:inline-flex;align-items:center;gap:6px;font-family:ui-monospace,Consolas,monospace}
.eye{background:none;border:1px solid var(--line);border-radius:8px;padding:1px 6px;cursor:pointer;color:var(--mute);line-height:1}.eye:hover{color:var(--text);border-color:var(--accent)}
.eye svg{width:16px;height:16px;vertical-align:-3px}
#boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);transition:opacity .5s .1s}
#boot.gone{opacity:0;pointer-events:none}
.wizsteps{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;transition:none!important}}
.martin{cursor:pointer}
.bye h2,.bye p{margin:2px 0}
.bye{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(8,10,20,.94);color:var(--text);text-align:center}
.lcat{position:relative;width:150px;margin-bottom:10px}
.lcat .martin{display:block;animation:bob 1.6s ease-in-out infinite}
.lpaw{position:absolute;right:-16px;top:-18px;transform-origin:50% 100%;animation:beckon .75s ease-in-out infinite}
.lcoin{position:absolute;left:-30px;bottom:-4px;animation:bob 1.2s ease-in-out infinite}
.lcollar{position:absolute;left:12%;right:12%;top:80%;height:7px;border-radius:4px;background:#d93a3a;box-shadow:0 1px 0 #0004}
.lbell{position:absolute;left:50%;top:5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#f5c542;border:2px solid #c98f10}
@keyframes beckon{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(24deg)}}
#bubble{position:fixed;z-index:80;max-width:200px;padding:7px 12px;font:700 13px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.5px;color:#14172a;background:#fff;pointer-events:none;
 box-shadow:-3px 0 #14172a,3px 0 #14172a,0 -3px #14172a,0 3px #14172a;animation:bub .25s steps(4) both}
#bubble::after{content:"";position:absolute;left:14px;bottom:-9px;width:6px;height:6px;background:#fff;box-shadow:-3px 0 #14172a,3px 0 #14172a,0 3px #14172a,-3px -3px #fff,3px -3px #fff}
@keyframes bub{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.petheart{position:fixed;z-index:81;pointer-events:none;animation:heartup 1s ease-out forwards}
@keyframes heartup{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-34px) scale(1.2);opacity:0}}
.martin.pet{animation:hop .35s ease-in-out 2}
/* menus, dialogs and the top bar are solid so nothing shows through them */
:root{--solid:#0b1030}[data-theme=light]{--solid:#ffffff}
[data-theme=ocean]{--solid:#06222e}[data-theme=forest]{--solid:#08210f}[data-theme=sunset]{--solid:#2a1015}[data-theme=rose]{--solid:#2a0f22}[data-theme=violet]{--solid:#170f33}[data-theme=crimson]{--solid:#240a0c}[data-theme=graphite]{--solid:#17181c}
.chrome,.dd,.modalbox,.drawer,.toast{background:var(--solid);backdrop-filter:none}
.dd{box-shadow:0 18px 40px #000a;z-index:40}
.doc{min-width:300px;max-width:380px;flex:0 1 380px;position:relative;z-index:1}
.doc .px.doctor{flex:0 0 auto;filter:drop-shadow(0 4px 10px rgba(59,224,168,.35));animation:bob 3.4s ease-in-out infinite}
.doc .px.doctor.worried{animation:shake .6s ease-in-out infinite;filter:drop-shadow(0 4px 10px rgba(255,180,84,.45))}
.doc .px.doctor.sad{animation:none;filter:grayscale(.4) drop-shadow(0 4px 10px rgba(79,140,255,.3))}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.retro{flex:1;min-width:0;padding:8px 10px;background:#08150f;color:#6dff9a;font:700 11px/1.55 ui-monospace,Consolas,monospace;letter-spacing:.6px;text-transform:uppercase;box-shadow:-3px 0 #6dff9a,3px 0 #6dff9a,0 -3px #6dff9a,0 3px #6dff9a;margin:3px}
.retro .hd{color:#fff;margin-bottom:4px}.retro .w{color:#ffd23f}
.retro::after{content:"_";animation:blinkc 1s steps(1) infinite}@keyframes blinkc{50%{opacity:0}}
.worry{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 0;font-size:.84rem}
.joinbox td,.joinbox th{font-size:.9rem}

.cv{display:block;width:100%;height:150px;object-fit:contain;border-radius:10px;background:linear-gradient(160deg,#1a2350,#0c1130);margin:-2px 0 6px}
.cv.blank{display:grid;place-items:center;font:800 1.7rem/1 ui-monospace,Consolas,monospace;letter-spacing:.08em;color:rgba(255,255,255,.55);background:linear-gradient(145deg,var(--bc1,#26336e),var(--bc2,#141a3c))}
.cv.blank[data-c=nes]{--bc1:#7a2b2b;--bc2:#2b1414}.cv.blank[data-c=snes]{--bc1:#4a3f7a;--bc2:#1a1633}.cv.blank[data-c^=gb]{--bc1:#3d6b3d;--bc2:#142414}
.cv.blank[data-c=n64]{--bc1:#2b6a7a;--bc2:#10262b}.cv.blank[data-c=gamecube]{--bc1:#5a3d9a;--bc2:#1e1536}.cv.blank[data-c^=ps]{--bc1:#2b4a8a;--bc2:#0f1a33}
.cv.blank[data-c=xbox],.cv.blank[data-c=x360]{--bc1:#2f7a3a;--bc2:#10260f}.cv.blank[data-c=ds],.cv.blank[data-c=3ds],.cv.blank[data-c=wii]{--bc1:#7a6a2b;--bc2:#262010}
.cv.tv{height:110px}
.hero{min-height:300px;padding:30px 32px}
.doc{flex:0 1 430px;min-width:340px}
.doc .px.doctor.happy{animation:hop 1.1s ease-in-out infinite}

/* ---------- batch 4: right-click menu, properties, 8-bit tip, office, live bar ---------- */
.game,.tvcard{-webkit-user-select:none;user-select:none}
.ctx{position:fixed;z-index:120;min-width:240px}
.ctxlist{background:var(--solid);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 18px 44px #000b;min-width:230px}
.ctxitem{position:relative}
.ctxlist button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;color:var(--text);text-align:left;padding:7px 10px;border-radius:8px;cursor:pointer;font:inherit}
.ctxlist button:hover,.ctxlist button:focus-visible{background:var(--accent);color:#fff;outline:none}
.ctxlist button:disabled{opacity:.45;cursor:not-allowed;background:none;color:var(--text)}
.ctxlist button.bold .lb{font-weight:700}.ctxlist .ck{width:14px;color:#3be0a8}.ctxlist .lb{flex:1}.ctxlist .arr{opacity:.7}
.ctxlist hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.ctxsub{display:none;position:absolute;left:calc(100% - 4px);top:-6px}
.ctx.flip .ctxsub{left:auto;right:calc(100% - 4px)}
.ctxitem:hover>.ctxsub,.ctxitem.open>.ctxsub{display:block}
.cv.prop{width:150px;aspect-ratio:3/4;height:auto;border-radius:8px;object-fit:cover}
/* Library: art cropped to each console's box shape (never stretched), coloured tags, the filter panel, hidden games */
.game .cv,.cv.prop,.cv.drw{height:auto;aspect-ratio:var(--ar,4/5);object-fit:cover;object-position:50% 28%}
.cv.drw{width:100%;border-radius:10px;margin:0}
.list .game .cvwrap{flex:0 0 64px;width:64px;margin:0 12px 0 0}.list .game .cv{border-radius:6px}.list .game .cv.blank{font-size:.8rem}
.yr{color:var(--link);font-weight:750}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.libfoot{flex-wrap:wrap}.libfoot .btn{white-space:nowrap}
.ltag{display:inline-block;font-size:.72rem;font-weight:650;line-height:1.25;padding:2px 8px;border-radius:999px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;cursor:default}
.rtag.r-usa{color:#fff;background:linear-gradient(90deg,#1f3a93 0 30%,#b22234 30% 100%);box-shadow:inset 0 0 0 1px #ffffff66}
.rtag.r-eu{color:#ffcc00;background:#003399;box-shadow:inset 0 0 0 1px #ffcc0080}
.rtag.r-jp{color:#bc002d;background:#fff;box-shadow:inset 0 0 0 1.5px #bc002d}
.rtag.r-any{color:var(--mute);border:1px solid var(--line);padding:1px 7px}
.etag{color:#fff;background:var(--eb,#3e4a54);box-shadow:inset 0 0 0 1px #ffffff40}
.gtag{color:var(--text);background:hsl(var(--gh) 60% 50% / .14);border:1px solid hsl(var(--gh) 55% 50% / .7);padding:1px 7px}
.fpanel{margin:10px 0 4px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 14px;align-items:end}

/* ---------- one look for every form control, in every theme ---------- */
:root{color-scheme:dark;--on-accent:#06101c;--field-h:38px;--ring:color-mix(in srgb,var(--accent) 30%,transparent);--box-line:color-mix(in srgb,var(--text) 45%,transparent)}
[data-mode=light]{color-scheme:light;--on-accent:#fff}
option,optgroup{background:var(--solid);color:var(--text)}
input[type=text],input[type=number],input[type=search],input[type=password],input[type=url],input[type=email],select,textarea{
 box-sizing:border-box;min-height:var(--field-h);padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);
 font:inherit;font-size:.95rem;line-height:1.3;transition:border-color .15s,box-shadow .15s,background .15s}
textarea{min-height:76px}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.75}
input[type=text]:hover,input[type=number]:hover,input[type=search]:hover,input[type=password]:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
input:disabled,select:disabled,textarea:disabled{opacity:.5;cursor:not-allowed}
select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:36px;
 background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
 background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select:focus{background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%)}
input[type=checkbox]:not(.switch input),input[type=radio]{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:20px;height:20px;margin:0;cursor:pointer;vertical-align:middle;
 border:1.5px solid var(--box-line);background:var(--panel2);transition:background .15s,border-color .15s,box-shadow .15s}
input[type=checkbox]:not(.switch input){border-radius:6px}
input[type=radio]{border-radius:50%}
input[type=checkbox]:not(.switch input):hover,input[type=radio]:hover{border-color:var(--accent)}
input[type=checkbox]:not(.switch input):checked,input[type=radio]:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:not(.switch input):checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
input[type=radio]:checked::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--on-accent)}
input[type=checkbox]:not(.switch input):focus-visible,input[type=radio]:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
input[type=checkbox]:not(.switch input):disabled,input[type=radio]:disabled{opacity:.45;cursor:not-allowed}
label:has(>input[type=checkbox]:not(.switch input)),label:has(>input[type=radio]){display:inline-flex;align-items:flex-start;gap:10px;cursor:pointer;line-height:1.35}
label:has(>input[type=checkbox]:not(.switch input))>input,label:has(>input[type=radio])>input{margin-top:1px}
.row>label.grow{min-width:0}
.card .row>label.grow+select,.card .row>label.grow+input[type=text],.card .row>label.grow+input[type=number]{width:300px;max-width:52%;flex:none;text-overflow:ellipsis}
.card .row>label.grow+input[type=number]{width:120px}
.fieldrow .fld input[type=text],.fieldrow .fld select{width:100%;max-width:380px}
.btn{min-height:var(--field-h)}
/* ---------- scrollbars that match the app (every theme), and bars you can drag ---------- */
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--accent) 55%,transparent) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}

/* Dialogs: Esc closes the top one, Tab stays inside it, and focus goes back to where it was. */

  for(const n of m.addedNodes){if(n.nodeType===1&&n.classList.contains("modal")){
   opener.set(n,document.activeElement);
   if(!n.contains(document.activeElement)){const f=n.querySelector(".primary")||n.querySelector(FOCUS);if(f)setTimeout(()=>{try{f.focus()}catch(e){}},0)}}}
  for(const n of m.removedNodes){if(n.nodeType===1&&n.classList&&n.classList.contains("modal")){

.tm-brand{display:flex;align-items:center;gap:.6em;font-weight:800;font-size:1.05em;letter-spacing:.02em;flex:0 0 auto}
.tm-brand svg{width:2em;height:auto}
.tm-tick{flex:1;min-width:0;text-align:center;font-weight:650;font-size:.88em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .35s ease}
.tm-tick.out{opacity:0}
.tm-tick b{color:var(--text)}
.tm-pill{display:inline-flex;align-items:center;gap:.45em;padding:.35em .8em;border-radius:99em;background:color-mix(in srgb,var(--solid) 55%,transparent);border:.07em solid var(--line);font-size:.85em;font-weight:600;white-space:nowrap;cursor:pointer}
.tm-pill .dot{width:.6em;height:.6em;border-radius:50%;background:var(--mute)}
.tm-pill.good .dot{background:var(--accent2);box-shadow:0 0 .6em var(--accent2)}
.tm-pill.play{background:var(--text);color:var(--bg);border-color:transparent}
.tm-pill:hover{border-color:var(--box-line,var(--line))}
.tm-clock{font-size:1.5em;font-weight:800;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right;white-space:nowrap}
.tm-clock small{display:block;font-size:.42em;font-weight:650;color:var(--mute);letter-spacing:.02em}
/* the hero: what is focused, large */
.tm-hero{flex:0 0 auto;height:var(--hh);display:flex;align-items:flex-end;gap:2em;padding:0 2.2em .7em;overflow:hidden}
.tm-hx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;max-width:46em}
.tm-kick{font-size:.8em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:.15em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-hero h1{font-size:2.3em;margin:0;line-height:1.08;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 .05em .4em color-mix(in srgb,var(--bg) 70%,transparent)}
.tm-facts{display:flex;flex-wrap:wrap;gap:.4em;margin:.55em 0 .1em;max-height:4.6em;overflow:hidden}
.tm-facts .tm-chip{font-size:.8em;background:color-mix(in srgb,var(--solid) 62%,transparent)}
.tm-hero p{margin:.4em 0 0;color:var(--mute);font-size:.95em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:40em}
.tm-hero p.warn{color:var(--warn);font-weight:650}
.tm-acts{display:flex;gap:.6em;margin-top:.8em;flex-wrap:wrap}
.tm-hb{display:inline-flex;align-items:center;gap:.5em;padding:.45em 1em .45em .5em;border-radius:99em;border:.08em solid var(--line);background:color-mix(in srgb,var(--solid) 65%,transparent);font-weight:750;font-size:.9em;cursor:pointer}
.tm-hb.pri{background:var(--text);color:var(--bg)!important;border-color:transparent}
.tm-hb .tm-g{margin:0}
.tm-hb:hover{transform:translateY(-.06em)}
.tm-steps{display:flex;gap:.7em;margin-top:.9em;flex-wrap:wrap}
.tm-step{display:flex;align-items:center;gap:.6em;padding:.55em .9em;border-radius:.8em;border:.08em solid var(--line);background:color-mix(in srgb,var(--solid) 70%,transparent);font-weight:750;cursor:pointer;max-width:18em}
.tm-step .n{flex:0 0 auto;width:1.6em;height:1.6em;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;font-weight:900;font-size:.85em}
.tm-step small{display:block;font-weight:600;color:var(--mute);font-size:.78em}
.tm-step.on{border-color:var(--accent);box-shadow:0 0 0 .12em var(--accent)}
.tm-hart{flex:0 0 auto;height:calc(var(--hh) - 1.6em);max-height:21em;aspect-ratio:var(--ar,3/4);border-radius:.9em;overflow:hidden;box-shadow:0 1em 2.6em #0009,0 0 0 .08em color-mix(in srgb,var(--text) 14%,transparent);position:relative;animation:tmart .35s ease both}
.tm-hart.info{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,var(--c1),var(--c2))}
.tm-hart.info svg{width:55%;height:auto;filter:drop-shadow(0 .2em .4em #0006)}
.tm-hart img{width:100%;height:100%;object-fit:cover;display:block}
.tm-hart.martin{aspect-ratio:auto;height:calc(var(--hh) - 2.5em);box-shadow:none;background:none;display:flex;align-items:flex-end}
.tm-hart.martin svg{height:100%;width:auto;filter:drop-shadow(0 .5em 1em #0007);animation:tmbob 3.2s ease-in-out infinite}
@keyframes tmart{from{opacity:0;transform:translateY(.6em) scale(.97)}to{opacity:1;transform:none}}
@keyframes tmbob{50%{transform:translateY(-.3em)}}
/* the rows */
.tm-rows{flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.tm-rows::after{content:"";display:block;height:60vh}
.tm-rows::-webkit-scrollbar,.tm-track::-webkit-scrollbar{display:none}
.tm-row{margin:0;opacity:.82;transition:opacity .2s ease}
.tm-row.cur{opacity:1}
.tm-rt{font-size:1.15em;margin:.25em 0 0;padding:0 1.9em;display:flex;align-items:center;gap:.55em;color:var(--text);white-space:nowrap}
.tm-rt svg{height:1.25em;width:auto}
.tm-rt .n{font-size:.68em;font-weight:700;color:var(--mute);padding:.15em .6em;border-radius:99em;background:color-mix(in srgb,var(--text) 9%,transparent)}
.tm-rt .n.good{color:var(--accent2)}
.tm-rt .n.warn{color:var(--warn)}
.tm-row.cur .tm-rt::before{content:"";width:.28em;height:1.1em;border-radius:.2em;background:var(--accent)}
.tm-track{position:relative;display:flex;align-items:flex-start;gap:1em;overflow-x:auto;overflow-y:hidden;padding:.75em 2.2em .9em;scrollbar-width:none}
.tm-tile{position:relative;flex:0 0 auto;width:calc(var(--th) * var(--r,.75));border-radius:.7em;background:color-mix(in srgb,var(--solid) 82%,transparent);border:.08em solid var(--line);cursor:pointer;outline:none;transition:transform .16s ease,box-shadow .16s ease;transform-origin:50% 55%;color:var(--text)}
.tm-tile .tm-art{position:relative;height:var(--th);border-radius:.63em .63em 0 0;overflow:hidden;background:linear-gradient(150deg,var(--c1,#3b6bff),var(--c2,#7a5cff));display:flex;align-items:center;justify-content:center}
.tm-tile .tm-art img.cv{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:auto}
.tm-tile .tm-tl{padding:.42em .55em .5em;font-size:.76em;font-weight:680;line-height:1.2;min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tm-tile.wide{--r:1.45}
.tm-tile.wide .tm-art{flex-direction:column;gap:.35em;padding:.6em;text-align:center;color:#fff}
.tm-tile.wide .tm-art svg{width:calc(var(--th) * .3);height:auto;filter:drop-shadow(0 .1em .2em #0006)}
.tm-tile .tm-art .pat{position:absolute;inset:0;background:conic-gradient(#ffffff12 25%,transparent 0 50%,#ffffff12 0 75%,transparent 0) 0 0/1em 1em;pointer-events:none}
.tm-tile .tm-val{position:relative;font-size:1.2em;font-weight:900;text-shadow:0 .06em .2em #0008;line-height:1.1}
.tm-tile .tm-sm{position:relative;font-size:.7em;font-weight:700;text-shadow:0 .06em .2em #0009;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tm-tile .tm-badge{position:absolute;top:.4em;left:.4em;padding:.15em .5em;border-radius:99em;background:#000b;color:#fff;font-size:.62em;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.tm-tile .tm-badge.warn{background:#7c2d12;color:#ffe2c7}
.tm-tile .tm-art.nw .tm-badge.warn{top:auto;bottom:0;left:0;right:0;border-radius:0;text-align:center;padding:.3em .4em;background:#7c2d12e6}
.tm-tile .tm-art.nw .tm-ph{padding-bottom:1.9em}
.tm-tile .tm-art.nw .tm-con,.tm-tile .tm-art.nw .tm-pl{bottom:1.75em}
.tm-tile .tm-mark{position:absolute;top:.35em;right:.35em;min-width:1.5em;height:1.5em;padding:0 .3em;border-radius:99em;background:#000b;color:#ffd23f;font-size:.85em;display:flex;align-items:center;justify-content:center;font-weight:800}
.tm-tile .tm-con{position:absolute;left:.35em;bottom:.35em;background:#000a;border-radius:.4em;padding:.15em .25em;display:flex}
.tm-tile .tm-con svg{width:1.5em;height:auto}
.tm-tile .tm-pl{position:absolute;right:.35em;bottom:.35em;background:#000a;color:#fff;border-radius:.4em;padding:.1em .4em;font-size:.65em;font-weight:800}
.tm-tile:hover{border-color:var(--box-line,var(--line))}
.tm-tile:focus,.tm-tile.f{transform:scale(1.08);z-index:2;border-color:transparent;box-shadow:0 0 0 .17em var(--accent),0 0 0 .3em color-mix(in srgb,var(--bg) 85%,transparent),0 .7em 1.8em #0007,0 0 2em color-mix(in srgb,var(--accent) 55%,transparent)}
.tm-tile.off .tm-art{filter:grayscale(.65) brightness(.8)}
/* a game without a cover: a made-up box in the console's colours, with a pixel badge from the title */
.tm-ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:.45em .5em .5em;color:#fff;text-align:left;background:linear-gradient(160deg,var(--c1),var(--c2))}
.tm-ph::before{content:"";position:absolute;inset:0;background:conic-gradient(#ffffff10 25%,transparent 0 50%,#ffffff10 0 75%,transparent 0) 0 0/.75em .75em,linear-gradient(180deg,transparent 45%,#0008)}
.tm-ph>*{position:relative}
.tm-ph .ph-top{display:flex;align-items:center;gap:.3em;font-size:.6em;font-weight:900;letter-spacing:.06em;text-transform:uppercase;opacity:.92;white-space:nowrap;overflow:hidden}
.tm-ph .ph-top svg{width:2.2em;height:auto;flex:0 0 auto}
.tm-ph .ph-sp{align-self:center;width:46%;max-width:5em;height:auto;filter:drop-shadow(.12em .12em 0 #0006)}
.tm-ph .ph-t{font-weight:900;font-size:calc(var(--th) * .085);line-height:1.08;text-shadow:.08em .08em 0 #0009;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.tm-ph.lg .ph-t{font-size:1.6em}.tm-ph.lg .ph-top{font-size:.85em}
.tm-ph .ph-rg{font-size:.55em;font-weight:800;opacity:.8;margin-top:.15em;text-transform:uppercase;letter-spacing:.05em}
.tm-hints{display:flex;align-items:center;gap:1.5em;flex-wrap:wrap;padding:.6em 2.2em .75em;border-top:.07em solid var(--line);background:color-mix(in srgb,var(--bg) 84%,transparent);font-size:.85em;font-weight:600}
.tm-hints .grow{flex:1}
.tm-g{display:inline-flex;align-items:center;justify-content:center;min-width:1.55em;height:1.55em;padding:0 .3em;border-radius:99em;font-weight:900;margin-right:.4em;font-size:.95em;color:#fff;background:#4b5563}
.tm-g.a{background:#2f9e44}.tm-g.b{background:#d6336c}.tm-g.x{background:#1c7ed6}.tm-g.y{background:#f2c200;color:#1a1a1a}.tm-g.lb,.tm-g.rt{border-radius:.35em}
.tm-g.k{border-radius:.35em;background:color-mix(in srgb,var(--text) 14%,transparent);color:var(--text);border:.07em solid var(--box-line,var(--line));font-weight:700}
.tm-hb.pri .tm-g.k{color:var(--bg);background:color-mix(in srgb,var(--bg) 18%,transparent)}
.tm-layer{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,#000 62%,transparent);backdrop-filter:blur(6px);animation:tmfade .18s ease both}
@keyframes tmfade{from{opacity:0}to{opacity:1}}
.tm-sheet{--th:9em;background:var(--solid);color:var(--text);border:.08em solid var(--line);border-radius:1.1em;padding:1.5em 1.8em;max-width:min(94vw,64em);max-height:92vh;overflow:auto;box-shadow:0 1.5em 4em #000a;animation:tmrise .22s ease both;scrollbar-width:thin}
@keyframes tmrise{from{transform:translateY(1em) scale(.98);opacity:0}to{transform:none;opacity:1}}
.tm-sheet h2{font-size:1.8em;margin:0 0 .3em;line-height:1.15}
.tm-sheet h3{font-size:1.2em;margin:.2em 0 .6em}
.tm-sheet p{margin:.3em 0 .8em;color:var(--mute)}
.tm-sheet .tm-note{display:flex;gap:.8em;align-items:center;padding:.7em .9em;border-radius:.7em;border:.08em solid color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent);margin:.2em 0 .9em;color:var(--text);font-weight:600}
.tm-sheet .tm-list{display:flex;flex-direction:column;gap:.4em;margin:.4em 0 .8em}
.tm-btns{display:flex;flex-direction:column;gap:.55em;min-width:16em}
.tm-btns.h{flex-direction:row;flex-wrap:wrap}
.tm-btn{display:flex;align-items:center;gap:.6em;font-size:1.05em;padding:.65em 1.2em;border-radius:.7em;background:color-mix(in srgb,var(--text) 8%,transparent);border:.1em solid var(--line);font-weight:700;text-align:left;cursor:pointer;outline:none;transition:transform .12s ease}
.tm-btn:disabled{opacity:.45;cursor:default}
.tm-btn:focus,.tm-btn.f{background:var(--text);color:var(--bg)!important;border-color:var(--text);transform:scale(1.04);box-shadow:0 0 0 .18em var(--accent)}
.tm-btn .tm-g{margin:0 0 0 auto}
.tm-btn small{font-weight:600;opacity:.75;margin-left:.3em}
.tm-details{display:grid;grid-template-columns:minmax(9em,15em) minmax(0,1fr);gap:1.8em;align-items:start}
.tm-details .tm-art{position:relative;aspect-ratio:var(--ar,3/4);border-radius:.8em;overflow:hidden;background:linear-gradient(150deg,var(--c1,#3b6bff),var(--c2,#7a5cff));display:flex;align-items:center;justify-content:center;box-shadow:0 1em 2.4em #0008}
.tm-details .tm-art img.cv{width:100%;height:100%;object-fit:cover}
.tm-meta{display:flex;flex-wrap:wrap;gap:.45em;margin:.2em 0 1em}
.tm-chip{display:inline-flex;align-items:center;gap:.4em;padding:.3em .7em;border-radius:99em;background:color-mix(in srgb,var(--text) 10%,transparent);border:.07em solid var(--line);font-weight:650;font-size:.88em;white-space:nowrap}
.tm-chip svg{width:1.4em;height:auto}
.tm-chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.tm-chip.good{color:var(--accent2)}
.tm-code{font:800 2.2em/1.1 ui-monospace,Consolas,monospace;letter-spacing:.08em;padding:.35em .6em;border-radius:.4em;background:color-mix(in srgb,var(--text) 10%,transparent);display:inline-block;margin:.2em 0 .6em}
.tm-q{font-size:1.6em;font-weight:800;min-height:1.6em;padding:.35em .6em;border-radius:.5em;border:.1em solid var(--box-line,var(--line));background:color-mix(in srgb,var(--text) 6%,transparent);margin:0 0 .7em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(80vw,30em)}
.tm-q .ph{color:var(--mute);font-weight:600}
.tm-q .caret{display:inline-block;width:.08em;height:1em;background:var(--accent);margin-left:.06em;vertical-align:-.1em;animation:tmblink 1s steps(1) infinite}
@keyframes tmblink{50%{opacity:0}}
.tm-kb{display:grid;grid-template-columns:repeat(10,minmax(2.2em,3.3em));gap:.4em;justify-content:center}
.tm-key{height:2.5em;border-radius:.5em;font-size:1.15em;font-weight:800;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--text) 9%,transparent);border:.08em solid var(--line);cursor:pointer;outline:none;padding:0}
.tm-key.w2{grid-column:span 2}.tm-key.w3{grid-column:span 3}.tm-key.w4{grid-column:span 4}
.tm-key.on{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.tm-key:focus,.tm-key.f{background:var(--text);color:var(--bg)!important;box-shadow:0 0 0 .16em var(--accent);transform:scale(1.06)}
.tm-results{display:flex;gap:.9em;overflow-x:auto;padding:1em .4em 1.1em;margin-top:.6em;scrollbar-width:none;min-height:3em;--th:8em}
.tm-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5em,1fr));gap:1em;padding:.8em .3em;--th:9em}
.tm-pick .tm-tile{width:auto}
.tm-hint{font-size:.85em;color:var(--mute)}
.tm-prog{height:.5em;border-radius:99em;background:color-mix(in srgb,var(--text) 12%,transparent);overflow:hidden;margin:.6em 0}
.tm-prog i{display:block;height:100%;width:40%;background:var(--accent);border-radius:99em;animation:tmprog 1.2s ease-in-out infinite alternate}
@keyframes tmprog{from{transform:translateX(-60%)}to{transform:translateX(210%)}}
/* TV versions of the desktop pages (getting emulators, friends, messages, the room): wider sheets with lists */
.tm-sheet.hub{width:min(94vw,52em)}
.tm-sheet.chat{width:min(94vw,46em)}
.tm-btn.sm{font-size:.9em;padding:.45em .9em}
.tm-btn.tab{font-size:.95em;padding:.4em 1em}
.tm-btn.tab.on{border-color:var(--accent);box-shadow:inset 0 -.22em 0 var(--accent)}
.tm-tabs{display:flex;align-items:center;gap:.5em;margin:0 0 .9em;flex-wrap:wrap}
.tm-tabs .tm-g{margin:0}
.tm-line{display:flex;align-items:center;gap:.6em;flex-wrap:wrap;padding:.35em .2em;border-bottom:.07em solid var(--line)}
.tm-line .nm{flex:1;min-width:10em;display:flex;align-items:center;gap:.55em;font-weight:750}
.tm-line .nm small{font-weight:600;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:24em}
.tm-line .nm svg{width:1.6em;height:auto;flex:0 0 auto}
.tm-dot{width:.65em;height:.65em;border-radius:50%;background:var(--mute);flex:0 0 auto}
.tm-dot.on{background:var(--accent2);box-shadow:0 0 .5em var(--accent2)}
.tm-codeinline{font-family:ui-monospace,Consolas,monospace;letter-spacing:.06em}
.tm-block{padding:.7em .9em;border-radius:.8em;border:.08em solid var(--line);background:color-mix(in srgb,var(--text) 4%,transparent)}
.tm-block p{margin:.3em 0 .6em}
.tm-bh{display:flex;align-items:center;gap:.6em;font-size:1.1em}
.tm-bh svg{width:2.2em;height:auto}
.tm-bh .tm-chip{margin-left:auto;font-size:.75em}
.tm-job{padding:.6em .9em;border-radius:.7em;border:.08em solid color-mix(in srgb,var(--accent) 55%,transparent);margin:.2em 0 .9em}
.tm-kv{display:grid;grid-template-columns:auto 1fr;gap:.35em 1em;margin:.5em 0 .8em;padding:.7em .9em;border-radius:.7em;background:color-mix(in srgb,var(--text) 6%,transparent)}
.tm-kv b{color:var(--mute);font-weight:700}
.tm-msgs{display:flex;flex-direction:column;gap:.45em;height:min(44vh,22em);overflow-y:auto;padding:.6em;border-radius:.8em;background:color-mix(in srgb,var(--text) 5%,transparent);margin:.3em 0 .9em;scrollbar-width:thin}
.tm-msg{align-self:flex-start;max-width:78%;padding:.5em .85em;border-radius:1em 1em 1em .25em;background:color-mix(in srgb,var(--text) 11%,transparent);outline:none;overflow-wrap:anywhere}
.tm-msg.mine{align-self:flex-end;background:color-mix(in srgb,var(--accent) 38%,transparent);border-radius:1em 1em .25em 1em}
.tm-msg b{display:block;font-size:.8em;color:var(--accent2)}
.tm-msg .t{display:block;font-size:.7em;color:var(--mute);margin-top:.15em}
.tm-msg:focus{box-shadow:0 0 0 .16em var(--accent)}
.tm-members{display:grid;grid-template-columns:repeat(auto-fill,minmax(14em,1fr));gap:.5em;margin:.2em 0 .6em}
.tm-mem{display:flex;align-items:center;gap:.55em;padding:.5em .7em;border-radius:.7em;border:.08em solid var(--line);background:color-mix(in srgb,var(--text) 5%,transparent)}
.tm-mem svg{width:1.7em;height:auto}
.tm-mem .nm{font-weight:750;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-mem small{color:var(--mute)}
.tm-mem.ready{border-color:color-mix(in srgb,var(--accent2) 60%,transparent)}
.tm-pick .tm-more .tm-art{display:flex;align-items:center;justify-content:center}
/* a page opened from TV mode and driven by a controller: the focus is easy to see from the sofa */
html.padnav #main :focus,html.padnav #tvback :focus,html.padnav .ctx :focus{outline:3px solid var(--accent);outline-offset:3px}
#tvback .tvbhint{display:none}
html.padnav #tvback .tvbhint{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--mute);padding:0 4px;white-space:nowrap}
#tvback .tvbhint .tm-g{font-size:12px;margin-right:2px}
/* leaving TV mode for a normal page: a way back */
#tvback{position:fixed;right:18px;bottom:18px;z-index:95;display:flex;gap:6px;align-items:center;padding:8px;border-radius:14px;background:var(--solid);border:1px solid var(--line);box-shadow:0 12px 30px #0007;animation:holidayIn .3s ease-out}
#tvback .btn{font-size:15px}
@media (max-width:760px),(max-height:520px){.tm-hero h1{font-size:1.6em}.tm-hints{gap:.8em}.tm-details{grid-template-columns:1fr}.tm-details .tm-art{max-width:10em}.tm-top .tm-pill.opt{display:none}.tm-hart{display:none}}
@media (max-width:1100px){.tm-tick{display:none}.tm-hx{max-width:none}}
@media (max-aspect-ratio:4/3){.tm-hart:not(.martin){max-height:15em}}
@media (prefers-reduced-motion:reduce){.tm-tile,.tm-btn,.tm-key,.tm-bd .ly{transition:none}.tm-tile:focus,.tm-tile.f{transform:none}.tm-amb .cl,.tm-amb .px,.tm-hart,.tm-hart.martin svg{animation:none}.tm-amb .px{display:none}}
/* the startup intro: an old TV switching on, static, Martin and the title */

/* Martin hanging over an edge: his head (MARTIN) peeks up, and two paws grip the edge on either side.

/* a short cute meow: two detuned oscillators gliding up then down ("mi-aow"), through two moving band-pass "formants" */
function tvMeow(ctx){try{const t=ctx.currentTime,out=ctx.createGain(),mix=ctx.createGain();

/* ---------- the state of TV mode ---------- */

/* ---------- the intro: TV turns on, static, Martin peeks over the edge and meows, the title bounces in ---------- */
function tvIntro(){return new Promise(resolve=>{

 const inset=Math.round(Math.min(W,H)*.026),pawW=Math.round(7*u);

 closeMenus();closeCtx();tvReturnBtn(false);TVM.pageMode=false;
 try{rememberPage("tv")}catch(e){}         // "Open Legacy Player to: the last page I used" can bring TV mode back

 [".chrome","#main"].forEach(s=>{const e=$(s);if(e)e.inert=true});
 tvBuild();

 const data=tvLoad();
