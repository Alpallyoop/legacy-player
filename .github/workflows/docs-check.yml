name: docs-check

on:
  push:
    branches:
      - main
      - master
  pull_request:

# Read-only: this workflow only checks files. Actions are pinned to full commit SHAs (tag in the comment).
permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify required files exist
        run: |
          set -euo pipefail
          test -f README.md
          test -f LICENSE
          test -f .gitignore
          test -f docs/VENTURE_LAB_PITCH.md
          test -f docs/ARCHITECTURE.md
          test -f docs/RUNTIME_SPEC_v1.md
          test -f docs/GAME_PACK_SPEC_v1.md
          test -f docs/LEGAL_POSITION.md
          test -f docs/ROADMAP.md
          test -f docs/IMPLEMENTATION_PLAN_v1.md
          test -f docs/ADAPTER_INTERFACE_v1.md
          test -f docs/WIRE_PROTOCOL_v1.md
          test -f docs/DOLPHIN_DSU_BACKEND_v1.md
          test -f docs/THREAT_MODEL_v1.md
          test -f docs/VERIFICATION_MATRIX_v1.md
          test -f docs/DOLPHIN_FRAME_CONTROL_PROTOCOL_v1.md
          test -f docs/DOLPHIN_AUTOCONFIG_v1.md
          test -f docs/FIRST_TARGET_MARIO_PARTY_v1.md
          test -f runtime/README.md
          test -f adapters/dolphin/README.md
          test -f game_packs/mario_party_4/README.md
          test -f server/README.md
          test -f tools/README.md
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f docs/USER_GUIDE.md
          test -f docs/RUNNING_LOCALLY.md

      - name: Verify markdown files are non-empty
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            test -s "$f"
          done < <(find . -type f \( -name "*.md" -o -name "*.yml" -o -name "*.yaml" \) -print0)

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Check relative links and anchors in the Markdown files
        run: python tools/check_links.py

      - name: Compile and test
        run: |
          python -m pip install --require-hashes -r tools/memory_probe/requirements.txt
          python tools/release_check.py
